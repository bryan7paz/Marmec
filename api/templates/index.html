<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação Regulatória</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Marmec — Pipeline Regulatório Marítimo</span>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="d-flex gap-2 mb-3">
      <button class="btn btn-outline-secondary btn-sm" data-filter="pendente">Pendentes</button>
      <button class="btn btn-outline-secondary btn-sm" data-filter="aprovado">Aprovados</button>
      <button class="btn btn-outline-secondary btn-sm" data-filter="reprovado">Reprovados</button>
      <button class="btn btn-outline-secondary btn-sm" data-filter="">Todos</button>
    </div>

    <div class="table-responsive">
      <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Data Publicação</th>
            <th>Entrada Em Vigor</th>
            <th>Requisito</th>
            <th>Norma</th>
            <th>Assunto</th>
            <th>Aplicação</th>
            <th>Status</th>
            <th>Item</th>
            <th>Itens Modificados / Objetivos</th>
            <th>Ação Sugerida</th>
            <th>Validação</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    function esc(s) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(s ?? ''));
      return d.innerHTML;
    }

    async function load(status) {
      const url = '/regs/' + (status ? `?status=${status}` : '');
      const res = await fetch(url);
      const data = await res.json();
      const tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.dataset.id = r.id;
        const id = esc(r.id);
        tr.innerHTML = `
          <td>${esc(r.data_publicacao)}</td>
          <td>${esc(r.entrada_em_vigor)}</td>
          <td>${esc(r.requisito)}</td>
          <td>${esc(r.norma)}</td>
          <td><span class="badge bg-primary">${esc(r.assunto) || '—'}</span></td>
          <td><span class="badge bg-info">${esc(r.aplicacao) || '—'}</span></td>
          <td><span class="badge bg-secondary">${esc(r.status) || '—'}</span></td>
          <td>${esc(r.item)}</td>
          <td>${esc(r.itens_modificados)}</td>
          <td>${esc(r.acao_sugerida)}</td>
          <td>
            <span class="badge ${badge(r.status_validacao)}">${esc(r.status_validacao)}</span>
            <button class="btn btn-success btn-sm ms-1" onclick="validate('${id}','aprovado')">Aprovar</button>
            <button class="btn btn-danger btn-sm" onclick="validate('${id}','reprovado')">Reprovar</button>
          </td>`;
        tbody.appendChild(tr);
      });
    }

    function badge(s) {
      return s === 'aprovado' ? 'bg-success' : s === 'reprovado' ? 'bg-danger' : 'bg-warning';
    }

    async function validate(id, action) {
      await fetch(`/regs/${id}/validate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, validated_by: 'especialista' })
      });
      load(document.querySelector('button.active')?.dataset.filter ?? '');
    }

    document.querySelectorAll('button[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('button[data-filter]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        load(btn.dataset.filter);
      });
    });

    load('');
  </script>
</body>
</html>
